[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pyaffineprep"
version = "0.1.0"
description = "Intra-subject preprocessing of MRI data in pure Python"
readme = "README.md"
requires-python = ">=3.7"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy",
    "scipy",
    "nibabel",
    "nilearn",
    "matplotlib",
    "scikit-learn",
    "joblib",
    "nipype",
    "pybids",
    "tqdm",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["pyaffineprep*"]
